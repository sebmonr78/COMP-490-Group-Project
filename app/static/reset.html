<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>DELTA - Reset password</title>

  <style>

    /* Colours used on the page (change them here to restyle it) */
    :root {
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --ink: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
    }

    html {
      background: #f3f4f6;
    }

    /* The whole form sits in one white card in the middle of the page */
    body {
      font-family: system-ui, sans-serif;
      color: var(--ink);
      line-height: 1.45;
      box-sizing: border-box;
      max-width: 440px;
      margin: 3rem auto;
      padding: 1.75rem 2rem 2rem;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin-bottom: 0;
      letter-spacing: 0.04em;
      color: #0f172a;
    }

    h2 {
      font-size: 1.2rem;
      margin: 1.25rem 0 0.25rem;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 0.25rem;
    }

    label {
      display: block;
      margin-top: 0.9rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 0.3rem;
      padding: 0.6rem 0.7rem;
      font: inherit;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    input.bad {
      border-color: #c62828;
      background: #fff5f5;
    }

    .field-error {
      color: #c62828;
      font-size: 0.8rem;
      margin: 0.25rem 0 0;
    }

    button {
      margin-top: 1.2rem;
      padding: 0.6rem 1rem;
      font: inherit;
      font-weight: 500;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    button:hover:not(:disabled) {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    /* The main button of a form fills the width of the card */
    form button[type="submit"] {
      width: 100%;
    }

    button.secondary {
      background: #fff;
      color: var(--ink);
      border-color: #d1d5db;
    }

    button.secondary:hover:not(:disabled) {
      background: #f3f4f6;
      border-color: #9ca3af;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .links {
      margin-top: 1rem;
      display: flex;
      gap: 1.25rem;
    }

    .links a {
      color: var(--accent-dark);
      font-size: 0.9rem;
      cursor: pointer;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .error {
      color: #c62828;
      background: #fbd5d5;
      padding: 0.6rem;
      border-radius: 8px;
      margin-top: 1rem;
    }

    .box {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-top: 1rem;
    }

    .box.ok {
      background: #d4f5dc;
      border-color: #9fd8ac;
    }

    .box.server {
      background: #fbd5d5;
      border-color: #e6a3a3;
    }

    .shown-email {
      font-weight: 600;
      word-break: break-all;
    }

    .divider {
      border-top: 1px solid var(--line);
      margin-top: 1.5rem;
      padding-top: 0.5rem;
    }

    [hidden] {
      display: none !important;
    }

    /* On a phone the card fills the screen */
    @media (max-width: 480px) {
      body {
        margin: 0;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }

  </style>
</head>

<body>
  <h1>DELTA</h1>
  <p class="subtitle">Detecting Environmental Layout and Tracking Alterations</p>

  <!-- Step 1: type the new password -->
  <section id="reset-form-section">
    <h2>Choose a new password</h2>
    <form id="reset-form" novalidate>
      <label>New password <input id="new-password" type="password" autocomplete="new-password"></label>
      <label>Confirm new password <input id="confirm-password" type="password" autocomplete="new-password"></label>
      <p id="reset-error" class="error" hidden></p>
      <button type="submit">Change password</button>
    </form>
  </section>

  <!-- Step 2: it worked -->
  <section id="reset-done-section" hidden>
    <div class="box ok">
      <h2>Password changed</h2>
      <p>You can log in with your new password now.</p>
    </div>
    <a href="/"><button type="button">Back to log in</button></a>
  </section>

  <script>
    // The reset link looks like /reset-password?token=abc123
    // The token proves the link came from the "Forgot password" step.
    const token = new URLSearchParams(window.location.search).get("token") || "";

    function showError(text) {
      const box = document.getElementById("reset-error");
      box.textContent = text;
      box.hidden = false;
    }

    document.getElementById("reset-form").addEventListener("submit", async event => {
      event.preventDefault();
      document.getElementById("reset-error").hidden = true;

      const password = document.getElementById("new-password").value;
      const password_confirm = document.getElementById("confirm-password").value;

      if (!password || !password_confirm) {
        showError("Enter your new password in both boxes.");
        return;
      }

      const button = event.target.querySelector("button[type=submit]");
      button.disabled = true;

      try {
        const response = await fetch("/api/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password, password_confirm }),
        });

        let data = {};
        try { data = await response.json(); } catch { /* empty body */ }

        if (response.ok) {
          document.getElementById("reset-form-section").hidden = true;
          document.getElementById("reset-done-section").hidden = false;
        } else {
          showError(typeof data.detail === "string" ? data.detail : "Something went wrong. Try again.");
        }
      } catch (error) {
        showError("Could not reach the server. Is uvicorn running?");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>

</html>
